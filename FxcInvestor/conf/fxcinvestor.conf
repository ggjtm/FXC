# FxcInvestor configuration — localhost dev defaults (docs/DESIGN.md §5).
# Flat key=value; loaded by com.fxc.common.config.FxcConfig. Override any key with -Dkey=value.

# OFX 2.x client to FxcBroker.
# ofx.user/ofx.password MUST match FxcBroker's conf/fxcbroker.conf expected creds (see FxcBroker B9).
ofx.broker.url = http://localhost:8082/ofx
ofx.user = investor
ofx.password = secret
ofx.brokerId = FXC-BROKER

# The account this agent trades. LEAVE BLANK to open one of its own at startup (docs/stories/004):
# the agent POSTs to the broker console's /api/accounts under agent.clientId, and the broker returns
# the same account every time that client id asks — so a restart resumes the same account rather than
# stranding the previous one. Set a number here to pin it instead (the REPL and the tests do).
account =
# Used only if opening is unavailable — a broker with account.open.enabled = false, or no console.
# Losing a private account should not stop the agent trading; it just shares this one.
account.fallback = 000000002
# Stable identity for account opening. Defaults to investor-<agent.seed>; scripts/demo.sh passes
# investor-a / investor-b so the two demo agents are distinguishable on the console.
agent.clientId =
broker.console.url = http://localhost:8083

# XMPP client to FxcPub (via Tigase): feed in, agent commentary out. (Feed ingestion is PLAN item 3.)
xmpp.host = localhost
xmpp.port = 5222
xmpp.domain = fxc.local
xmpp.user = investor
xmpp.password = secret

# Agent loop (single-instance runner — docs/stories/004).
#
# NOTE: these files are parsed by java.util.Properties, which honours `#` ONLY at the start of a
# line — a trailing comment becomes part of the value. Keep every comment on its own line
# (root PROBLEMS.md P10).
agent.enabled = true
# rando (implemented); booker/bookfish also available (docs/stories/002, 003)
agent.strategy = rando
agent.symbol = ARVX
# ToDo: replace with XMPP-feed-derived last sale (PLAN item 3)
agent.seedLastSale = 42.10
agent.intervalMs = 1000
# 0 = run until interrupted
agent.ticks = 10
agent.seed = 42
# How often the agent re-reads its own cash and share positions over OFX. Deliberately an interval,
# not per tick: a statement read is a round trip and FxcBroker's OFX server is a fixed 4-thread pool,
# so per-tick reads would double request load against that ceiling for slow-moving data. The
# liquidity-managed strategies (booker/bookfish) size their orders from this.
agent.portfolioRefreshMs = 5000

# MariaDB primary + archive store (FxcInvestor does not use GridGain).
db.url = jdbc:mariadb://localhost:3306/fxc_investor
db.user = fxc
db.password = fxc
