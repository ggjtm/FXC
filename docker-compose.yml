# FXC dev infrastructure: one MariaDB instance + stock, unmodified Tigase XMPP server.
#
# MariaDB hosts every component's cold/archival schema (fxc_pub, fxc_broker, fxc_exchange,
# fxc_investor) AND Tigase's own repository (tigasedb). Tigase (docs/DESIGN.md §4.3) runs 100%
# unmodified from the vendor image — configured only via the mounted config.tdsl, no custom code.
#
# NOTE: the official image is `tigase/tigase-xmpp-server` (the reference docs' `tigase/tigase-server`
# was incorrect). Pinned to 8.4.1 per the confirmed version catalog.
#
# Tigase is AGPLv3 (a commercial license is available). Bringing this service up runs that software.

name: fxc

services:
  mariadb:
    image: mariadb:11.8
    container_name: fxc-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-fxc-root}
    ports:
      - "3306:3306"
    volumes:
      - fxc-mariadb-data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot init (docker-compose analog of a K8s initContainer): loads Tigase's schema into
  # MariaDB with the FK-signedness compatibility fix, then exits. `tigase` waits for it to complete.
  tigase-init:
    build:
      context: ./docker/tigase
    image: fxc/tigase:8.4.1
    container_name: fxc-tigase-init
    depends_on:
      mariadb:
        condition: service_healthy
    entrypoint: ["/init-schema.sh"]
    restart: "no"

  tigase:
    # Builds a thin image around the UNMODIFIED Tigase 8.4.1 community dist on JDK 17 (Tigase's
    # bundled Groovy/ASM cannot read Java 21+ class files; the official tigase/tigase-xmpp-server
    # image is a non-runnable skeleton — see docker/tigase/Dockerfile and README "JDK requirements").
    image: fxc/tigase:8.4.1
    container_name: fxc-tigase
    depends_on:
      mariadb:
        condition: service_healthy
      tigase-init:
        condition: service_completed_successfully
    ports:
      - "5222:5222"   # client-to-server (XMPP c2s) — Smack connects here
      - "5269:5269"   # server-to-server
      - "5280:5280"   # HTTP (BOSH / WebSocket / REST)
      - "8080:8080"   # HTTP admin UI
    # NOTE: config.tdsl is baked into the image (Dockerfile COPY), NOT bind-mounted — Tigase
    # rewrites/backs up its config on startup, which fails against a mounted file. Edit
    # docker/tigase/config.tdsl and rebuild to change server config.
    volumes:
      - fxc-tigase-logs:/opt/tigase/logs

  # Investor load harness (FxcInvestor/docs/stories/006), replacing the retired Gatling harness.
  # Web UI on http://localhost:8089 — start/stop a run and change users or spawn rate WHILE it runs,
  # which is the capability Gatling OSS lacked (its knobs froze at JVM start).
  #
  # Unlike the other services this one reaches OUT to the host: the four Java components run on the
  # host via ./gradlew, so the broker's OFX endpoint is at host.docker.internal:8082. `extra_hosts`
  # makes that name resolve on Linux too, where it is not automatic.
  #
  # Build context is the repo root (the harness source is in loadgen/), unlike tigase's own-directory
  # context — see docker/locust/Dockerfile and .dockerignore.
  locust:
    build:
      context: .
      dockerfile: docker/locust/Dockerfile
    image: fxc/locust:2.32.5
    container_name: fxc-locust
    ports:
      - "8089:8089"   # Locust web UI — the workload control surface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Target the broker's OFX endpoint on the host.
      LOCUST_HOST: ${FXC_LOADGEN_HOST:-http://host.docker.internal:8082}
      # Laptop-appropriate default: 8 users at ~1 order/1.5s ≈ 5 orders/sec aggregate. Raising it is
      # an explicit action in the UI.
      LOCUST_USERS: ${FXC_LOADGEN_USERS:-8}
      LOCUST_SPAWN_RATE: ${FXC_LOADGEN_SPAWN_RATE:-2}
      # Begin swarming on startup so the demo is continuous without needing a browser; the UI stays
      # live for control. Set false to come up idle and start it by hand.
      LOCUST_AUTOSTART: ${FXC_LOADGEN_AUTOSTART:-true}
      FXC_ACCOUNTS: ${FXC_LOADGEN_ACCOUNTS:-000123456,000654321}
      FXC_SYMBOLS: ${FXC_LOADGEN_SYMBOLS:-ACME}
      # booker, not rando, for the same reason scripts/demo.sh defaults its agents to booker: the
      # liquidity-managed strategies scale buying to cash and sell to keep a cash floor, so the flow
      # is sustainable indefinitely. rando is naive by design and a continuous run of it just
      # exhausts one side of the account and degrades into rejections.
      FXC_STRATEGY: ${FXC_LOADGEN_STRATEGY:-booker}
    restart: unless-stopped

volumes:
  fxc-mariadb-data:
  fxc-tigase-logs:
