# One salt-cloud profile per fxc role. Each sets the `roles` grain at instance-creation time so the
# minion self-identifies to top.sls's `match: pillar` / `roles:<value>` targeting without a
# separate per-minion pillar file (pillar.example/topology/*.sls is the alternative for
# hand-provisioned minions). Security-group IDs and the AMI are placeholders — portable across AWS
# accounts; fill in real values for your account/VPC. Ingress rules per fxc/docs/DESIGN.md's
# dependency table.

fxc-exchange:
  provider: fxc-aws-ec2
  image: ami-CHANGEME
  size: t3.medium
  securitygroupid: sg-fxc-exchange   # 9876/8090/8091 ingress from broker/pub SGs + operator IP
  minion:
    grains:
      roles: [exchange]

fxc-broker:
  provider: fxc-aws-ec2
  image: ami-CHANGEME
  size: t3.medium
  securitygroupid: sg-fxc-broker     # 8082/8083 ingress from investor/locust SGs + operator IP
  minion:
    grains:
      roles: [broker]

fxc-pub:
  provider: fxc-aws-ec2
  image: ami-CHANGEME
  size: t3.small
  securitygroupid: sg-fxc-pub        # 9878 ingress from broker SG
  minion:
    grains:
      roles: [pub]

fxc-investor:
  provider: fxc-aws-ec2
  image: ami-CHANGEME
  size: t3.small
  securitygroupid: sg-fxc-investor   # no listening ports needed; egress-only to broker/pub/exchange
  minion:
    grains:
      roles: [investor, locust]      # combined onto one instance by default

fxc-mariadb:
  provider: fxc-aws-ec2
  image: ami-CHANGEME
  size: t3.large                     # I/O-heavier; adjust per real load testing
  securitygroupid: sg-fxc-mariadb    # 3306 ingress from every other role's SG
  minion:
    grains:
      roles: [mariadb]

fxc-tigase:
  provider: fxc-aws-ec2
  image: ami-CHANGEME                # runs a native JDK 17, isolated on its own instance from the
  size: t3.small                     # JDK-21 Java roles (fxc/docs/PROBLEMS.md)
  securitygroupid: sg-fxc-tigase     # 5222/5269/5280/8080 ingress
  minion:
    grains:
      roles: [tigase]

# Alternative: everything on one box (roles collapse via the same top.sls mechanism). JDK17/JDK21
# would coexist on this single host — see fxc/docs/PROBLEMS.md for the risk that creates.
fxc-all-in-one:
  provider: fxc-aws-ec2
  image: ami-CHANGEME
  size: t3.2xlarge
  securitygroupid: sg-fxc-demo
  minion:
    grains:
      roles: [mariadb, tigase, exchange, pub, broker, investor, locust]
