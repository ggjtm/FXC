<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FxcExchange — Console</title>
<link rel="stylesheet" href="/common/fxc.css">
<style>
  /* Exchange-specific layout only; everything shared lives in /common/fxc.css. */
  #readout { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 7px 14px; border-top: 1px solid var(--border); }
  #readout .item { display: flex; align-items: baseline; gap: 6px; color: var(--muted); }
  #readout .item b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  #readout .item.up b { color: var(--up); }
  #readout .item.down b { color: var(--down); }
  #readout .swatch { width: 10px; height: 10px; border-radius: 2px; }
</style>
</head>
<body>

  <header class="fxc-header">
    <div class="fxc-brand">FxcExchange<span class="fxc-sub">Exchange Console</span></div>

    <div class="fxc-menu" id="controls">
      <button class="fxc-menu-btn" type="button" aria-haspopup="menu">Controls ▾</button>
      <div class="fxc-menu-panel" role="menu">
        <div class="fxc-menu-label">Trading session</div>
        <button class="fxc-menu-item" role="menuitem" type="button" data-action="haltMarket"
                data-danger data-confirm-label="Click again to halt all trading">Stop trading (all symbols)</button>
        <button class="fxc-menu-item" role="menuitem" type="button" data-action="openMarket">Start trading (all symbols)</button>
        <div class="fxc-menu-sep"></div>
        <div class="fxc-menu-label">Selected symbol</div>
        <button class="fxc-menu-item" role="menuitem" type="button" data-action="haltSymbol"
                data-danger data-confirm-label="Click again to halt this symbol">Stop trading this symbol</button>
        <button class="fxc-menu-item" role="menuitem" type="button" data-action="openSymbol">Start trading this symbol</button>
        <div class="fxc-menu-sep"></div>
        <div class="fxc-menu-label">Order book</div>
        <button class="fxc-menu-item" role="menuitem" type="button" data-action="clearSymbol"
                data-danger data-confirm-label="Click again to cancel all orders">Clear this symbol's book</button>
        <button class="fxc-menu-item" role="menuitem" type="button" data-action="clearAll"
                data-danger data-confirm-label="Click again to cancel EVERY order">Clear every book</button>
      </div>
    </div>

    <div class="fxc-status" id="status"></div>
  </header>

  <div class="fxc-banner" id="banner"></div>

  <div class="fxc-toolbar">
    <div class="fxc-field">
      <label for="symbol">Security</label>
      <select id="symbol"></select>
    </div>
    <div class="fxc-field">
      <label for="start">Start</label>
      <input type="datetime-local" id="start">
    </div>
    <div class="fxc-field">
      <label for="end">End</label>
      <input type="datetime-local" id="end">
      <span class="fxc-hint">empty = live</span>
    </div>
    <div class="fxc-field">
      <label>Style</label>
      <div class="fxc-toggle" id="styleToggle">
        <button type="button" data-style="candles" class="is-active">Candles</button>
        <button type="button" data-style="lines">Lines</button>
      </div>
    </div>
    <div class="fxc-field">
      <label for="granularity">Granularity</label>
      <select id="granularity">
        <option value="1m" selected>1m</option>
        <option value="5m">5m</option>
        <option value="15m">15m</option>
        <option value="30m">30m</option>
        <option value="1h">1h</option>
        <option value="4h">4h</option>
        <option value="1d">1d</option>
        <option value="1w">1w</option>
      </select>
    </div>
    <div class="fxc-field">
      <label>&nbsp;</label>
      <button class="fxc-btn" id="load" type="button">Load</button>
    </div>
    <div class="fxc-field" style="margin-left:auto">
      <label>Applied</label>
      <span class="fxc-hint" id="applied">—</span>
    </div>
  </div>

  <main class="fxc-main">
    <div class="fxc-plot" id="plot">
      <svg id="chart" role="img" aria-labelledby="chartTitle"><title id="chartTitle">Price candles</title></svg>
    </div>
    <div class="fxc-empty" id="empty">No trades in range.</div>
    <div class="fxc-tooltip" id="tooltip"></div>
    <!-- The value path that does not depend on hovering: the latest (or hovered) bar, in text. -->
    <div id="readout" aria-live="polite"></div>
  </main>

<script src="/common/vendor/d3.v7.min.js"></script>
<script src="/common/fxc-api.js"></script>
<script src="/common/fxc-menu.js"></script>
<script src="/common/fxc-status.js"></script>
<script src="/assets/exchange.js"></script>
</body>
</html>
