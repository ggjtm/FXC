# FxcExchange configuration — localhost dev defaults (docs/DESIGN.md §5).
# Flat key=value; loaded by com.fxc.common.config.FxcConfig. Override any key with -Dkey=value.

# FIX acceptor (brokers connect here): NewOrderSingle/OrderCancelRequest in, ExecutionReport out.
fix.acceptor.host = 0.0.0.0
fix.acceptor.port = 9876

# Price-data feed service (FxcExchange/docs/stories/001): REST + charting web UI, and a live
# ticker WebSocket. Open http://localhost:8090/ in a browser once the exchange is running.
feed.enabled = true
feed.http.port = 8090
feed.ws.port = 8091

# Exchange console controls (FxcExchange/docs/stories/002): halt/resume trading and clear the order
# book. These mutate live trading and are UNAUTHENTICATED (docs/DESIGN.md §7 "Auth realism"), so they
# are a deliberate switch: set false to serve a read-only monitor console instead.
feed.controls.enabled = true

# Trading session at boot. TRUE means the exchange comes up HALTED and every order is rejected until
# somebody opens the market — from the console's Controls menu, or `POST /api/session/open`. That is
# the point: a demo should start quiet, so opening the market is something you can show rather than
# something that already happened before anyone was looking. `scripts/demo.sh` waits for the market to
# open before it starts its agents; `--batch` opens it automatically, because the unattended smoke test
# must not need a human.
#
# Only the standalone process reads this — ExchangeServer.start() still boots an open market, so the
# integration tests are unaffected. Setting this true with feed.controls.enabled=false leaves a market
# nothing can open; the exchange warns at startup if you do.
session.startClosed = true

# Embedded GridGain node (hot state; in-memory by default).
gridgain.instanceName = fxc-exchange
gridgain.persistence.enabled = false

# MariaDB cold/archival store.
db.url = jdbc:mariadb://localhost:3306/fxc_exchange
db.user = fxc
db.password = fxc
