# FxcBroker configuration — localhost dev defaults (docs/DESIGN.md §5).
# Flat key=value; loaded by com.fxc.common.config.FxcConfig. Override any key with -Dkey=value.

# OFX 2.x server (FxcInvestor clients connect here over HTTP).
ofx.http.host = 0.0.0.0
ofx.http.port = 8082
# Expected OFX signon credentials — MUST match FxcInvestor's conf/fxcinvestor.conf (see PROBLEMS B9).
ofx.user = investor
ofx.password = secret
ofx.brokerId = FXC-BROKER
# OFX request threads — the hard ceiling on OFX throughput. Four comfortably serves the demo's own
# agents; the Locust harness (loadgen/) can generate more concurrency than that, and everything queues
# behind it. Raise this before blaming the harness for latency.
ofx.http.threads = 4

# The tradable float and who holds it (docs/stories/006).
#
# An ISSUER creates the float once at startup and places it with the two market makers; nothing else
# in the system ever creates shares. That is deliberate: seeding shares per account meant every
# investor added to a run inflated the supply, and in a market where nobody can be short that can only
# push the price down (docs/PROBLEMS.md P19). The issuer holds whatever is not allocated — with the
# defaults below it issues 1,000,000 and places all of it, so it ends at zero.
# Internal broker accounts live below 100 and are hidden from the console (pnl.internalAccountsBelow):
# the issuer at 0, the two market makers at 1 and 2. Customer accounts start at account.open.first.
account.issuer = 000000000
account.issue.shares = 1000000
account.mm.shares = 500000

# The market makers / initial liquidity providers. They hold the inventory investors buy from and the
# cash to buy it back, and scripts/demo.sh points its two Java agents at them. Everyone else opens a
# cash-only account and has to bid for stock (account.open.* below).
account.dev = 000000001
account.dev2 = 000000002
account.seedCash = 1000000
account.seedSymbol = ACME
# Issue price — the cost basis the float carries until the market prices it.
account.seedSharePrice = 42.00

# Agents open their own accounts (docs/stories/004) over POST /api/accounts, so each trading agent's
# P&L on the console is its own rather than a blend of everything sharing a dev account. Every agent
# opens with the same cash, so every curve on the console starts from the same purchasing power.
# Numbers start at account.open.first, well clear of the internal accounts above.
# Set false to serve only the seeded accounts.
account.open.enabled = true
account.open.first = 100000
account.open.numberWidth = 9
# CASH ONLY (seedShares = 0). An opened account that also carried shares would mint them, so adding
# investors mid-run inflated the float instead of bringing capital to it: nobody in this market can be
# short, so a growing float with a fixed appetite can only push the price down (docs/PROBLEMS.md P19).
# The tradable float is what the dev accounts above hold — raise account.seedShares if the market
# needs more stock to trade; investors arrive with money and bid for it.
# What an investor opens with. Deliberately a tenth of a market maker's working capital: investors are
# retail-sized next to the desks holding the float, and the ratio of investor cash to tradable float is
# what sets how hard the price can be bid — $1M apiece put ~$8M behind eight investors chasing a
# 1,000,000-share float and the price ran 36% in ten minutes.
account.open.seedCash = 100000
account.open.seedShares = 0

# Per-account P&L curve on the console (docs/stories/003). The curve is a ROLLING WINDOW: points
# older than pnl.windowMs are dropped, so a demo that runs for hours shows its last quarter hour
# instead of freezing at a point ceiling. The other two bound cost rather than meaning —
# maxPointsPerAccount is what one /api/pnl response carries (the console polls it every second, and
# ~600 is the chart's width in pixels, so downsampling to it is invisible), and groupSize is how
# many accounts carry a curve at all: the best 5 by P&L, the 5 most active, and the worst 5 (the rest
# still report totals in the table).
# maxRetainedPoints is a backstop for a fill rate that puts more than that inside the window.
# Accounts numbered below this are the broker's own — the issuer and the market makers — and are left
# out of the console entirely: no curve, no table row, and no place in the best/most-active/worst
# groups. They are infrastructure, and they distort the picture badly if shown: the market makers hold
# the whole float, so mark-to-market on it dwarfs every customer's P&L and they win or lose every group
# by three orders of magnitude (docs/PROBLEMS.md P19). Set 0 to show everything.
pnl.internalAccountsBelow = 100

pnl.windowMs = 900000
pnl.maxPointsPerAccount = 600
pnl.groupSize = 5
pnl.maxRetainedPoints = 5000

# Monitor/controller console (FxcBroker/docs/stories/002): static HTML+CSS+JS over REST, on its own
# HTTP server so the OFX endpoint above stays POST-only. Open http://localhost:8083/ once running.
# 8081 stays reserved for the deferred Mastodon gateway (docs/DESIGN.md §7.2).
web.enabled = true
web.http.port = 8083
# The start/stop trading control mutates live order handling and is UNAUTHENTICATED
# (docs/DESIGN.md §7 "Auth realism"): set false to serve a read-only monitor console. Account opening
# is gated separately by account.open.enabled above — it is a client operation, not an operator one,
# so making the console read-only must not stop agents from opening accounts.
web.controls.enabled = true

# FIX initiator to FxcExchange (order routing).
fix.exchange.host = localhost
fix.exchange.port = 9876

# FIX drop-copy initiator to FxcPub (publishes ExecutionReports).
fix.pub.host = localhost
fix.pub.port = 9878

# XMPP bot account on FxcPub (via Tigase) for human-readable fill statuses.
# NOTE: these keys are not read yet — the broker's XMPP publication leg is still open (see this
# component's docs/PLAN.md); only the FIX drop-copy leg is wired. The password must match what
# `docker/tigase/init-schema.sh` provisions for every service account (`TIGASE_SVC_PASS`, default
# `secret`), not the account name — see root PROBLEMS.md P9.
xmpp.host = localhost
xmpp.port = 5222
xmpp.domain = fxc.local
xmpp.user = broker
xmpp.password = secret

# Embedded GridGain node (hot state; in-memory by default).
gridgain.instanceName = fxc-broker
gridgain.persistence.enabled = false

# MariaDB cold/archival store.
db.url = jdbc:mariadb://localhost:3306/fxc_broker
db.user = fxc
db.password = fxc
