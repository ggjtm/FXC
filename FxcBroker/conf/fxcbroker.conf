# FxcBroker configuration — localhost dev defaults (docs/DESIGN.md §5).
# Flat key=value; loaded by com.fxc.common.config.FxcConfig. Override any key with -Dkey=value.

# OFX 2.x server (FxcInvestor clients connect here over HTTP).
ofx.http.host = 0.0.0.0
ofx.http.port = 8082
# Expected OFX signon credentials — MUST match FxcInvestor's conf/fxcinvestor.conf (see PROBLEMS B9).
ofx.user = investor
ofx.password = secret
ofx.brokerId = FXC-BROKER
# OFX request threads — the hard ceiling on OFX throughput. Four comfortably serves the demo's own
# agents; the Locust harness (loadgen/) can generate more concurrency than that, and everything queues
# behind it. Raise this before blaming the harness for latency.
ofx.http.threads = 4

# Dev accounts seeded on startup (PLAN Phase 6). Both get cash AND shares so buys and sells are
# fundable and can cross each other in the demo.
account.dev = 000123456
account.dev2 = 000654321
account.seedCash = 1000000
account.seedSymbol = ACME
account.seedShares = 1000
account.seedSharePrice = 42.00

# Monitor/controller console (FxcBroker/docs/stories/002): static HTML+CSS+JS over REST, on its own
# HTTP server so the OFX endpoint above stays POST-only. Open http://localhost:8083/ once running.
# 8081 stays reserved for the deferred Mastodon gateway (docs/DESIGN.md §7.2).
web.enabled = true
web.http.port = 8083
# The start/stop trading control mutates live order handling and is UNAUTHENTICATED
# (docs/DESIGN.md §7 "Auth realism"): set false to serve a read-only monitor console.
web.controls.enabled = true

# FIX initiator to FxcExchange (order routing).
fix.exchange.host = localhost
fix.exchange.port = 9876

# FIX drop-copy initiator to FxcPub (publishes ExecutionReports).
fix.pub.host = localhost
fix.pub.port = 9878

# XMPP bot account on FxcPub (via Tigase) for human-readable fill statuses.
# NOTE: these keys are not read yet — the broker's XMPP publication leg is still open (see this
# component's docs/PLAN.md); only the FIX drop-copy leg is wired. The password must match what
# `docker/tigase/init-schema.sh` provisions for every service account (`TIGASE_SVC_PASS`, default
# `secret`), not the account name — see root PROBLEMS.md P9.
xmpp.host = localhost
xmpp.port = 5222
xmpp.domain = fxc.local
xmpp.user = broker
xmpp.password = secret

# Embedded GridGain node (hot state; in-memory by default).
gridgain.instanceName = fxc-broker
gridgain.persistence.enabled = false

# MariaDB cold/archival store.
db.url = jdbc:mariadb://localhost:3306/fxc_broker
db.user = fxc
db.password = fxc
