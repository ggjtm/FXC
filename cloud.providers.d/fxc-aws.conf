# salt-cloud EC2 provider for the fxc formula. Credentials/keypair are placeholders — supply real
# values via environment/your own secrets store, never commit them here. See fxc/docs/DESIGN.md.
fxc-aws-ec2:
  driver: ec2
  id: CHANGEME_AWS_ACCESS_KEY_ID
  key: CHANGEME_AWS_SECRET_ACCESS_KEY
  keyname: fxc-deploy
  private_key: /etc/salt/fxc-deploy.pem
  location: us-east-1
  availability_zone: us-east-1a
  ssh_username: ec2-user
  minion:
    master: salt.fxc.internal
